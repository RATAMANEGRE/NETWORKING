
<div class="min-h-screen bg-[#111111] px-4 py-12">

  <div class="max-w-4xl mx-auto">

    <!-- En-tête -->
    <div class="text-center mb-10">
      <h1 class="text-orange-500 text-4xl font-bold">
        Publier une offre
      </h1>

      <p class="text-gray-400 mt-4">
        Présentez votre opportunité et trouvez les talents
        qui correspondent à vos besoins.
      </p>
    </div>

    <!-- Formulaire -->
    <form
  (ngSubmit)="publierOffre()"
  class="bg-[#1c1c1c] border border-gray-700 rounded-xl p-6 md:p-10 space-y-6"
>
@if (messageErreur) {
  <p class="bg-red-900/30 border border-red-500 text-red-400 p-3 rounded-lg">
    {{ messageErreur }}
  </p>
}

@if (messageConfirmation) {
  <p class="bg-green-900/30 border border-green-500 text-green-400 p-3 rounded-lg">
    {{ messageConfirmation }}
  </p>
}

      <!-- Titre et entreprise -->
      <div>
        <label class="block text-white mb-2 font-medium">
          Titre de l'offre *
        </label>
       <input
  type="text"
  name="titre"
  [(ngModel)]="titre"
  placeholder="Exemple : Développeur Web"
  class="w-full bg-[#111111] border border-gray-600 rounded-lg p-3 text-white focus:border-orange-500 outline-none"
>
      </div>

      <div>
        <label class="block text-white mb-2 font-medium">
          Nom de l'entreprise *
        </label>
        <input
  type="text"
  name="entreprise"
  [(ngModel)]="entreprise"
  placeholder="Nom de votre entreprise"
  class="w-full bg-[#111111] border border-gray-600 rounded-lg p-3 text-white focus:border-orange-500 outline-none"
>
      </div>

      <!-- Domaine et contrat -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <div>
          <label class="block text-white mb-2 font-medium">
            Domaine d'activité *
          </label>
          <select
  name="domaine"
  [(ngModel)]="domaine"
  class="w-full bg-[#111111] border border-gray-600 rounded-lg p-3 text-white focus:border-orange-500 outline-none"
>
            <option value="">Choisir un domaine</option>
            <option>Développement Web</option>
            <option>Développement Mobile</option>
            <option>Data Analysis</option>
            <option>Intelligence artificielle</option>
            <option>Cybersécurité</option>
            <option>UI/UX Design</option>
            <option>Réseaux et systèmes</option>
            <option>Autre</option>
          </select>
        </div>

        <div>
          <label class="block text-white mb-2 font-medium">
            Type de contrat *
          </label>
         <select
  name="contrat"
  [(ngModel)]="contrat"
  class="w-full bg-[#111111] border border-gray-600 rounded-lg p-3 text-white focus:border-orange-500 outline-none"
>
            <option value="">Choisir un contrat</option>
            <option>Stage</option>
            <option>CDD</option>
            <option>CDI</option>
            <option>Freelance</option>
          </select>
        </div>

      </div>

      <!-- Localisation et date -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <div>
          <label class="block text-white mb-2 font-medium">
            Localisation *
          </label>
          <input
  type="text"
  name="localisation"
  [(ngModel)]="localisation"
  placeholder="Exemple : Ouagadougou"
  class="w-full bg-[#111111] border border-gray-600 rounded-lg p-3 text-white focus:border-orange-500 outline-none"
>
        </div>

        <div>
          <label class="block text-white mb-2 font-medium">
            Date limite de candidature *
          </label>
          <input
  type="date"
  name="dateLimite"
  [(ngModel)]="dateLimite"
  class="w-full bg-[#111111] border border-gray-600 rounded-lg p-3 text-white focus:border-orange-500 outline-none"
>
        </div>

      </div>

      <!-- Description -->
      <div>
        <label class="block text-white mb-2 font-medium">
          Description de l'offre *
        </label>
        <textarea
        name="description"
        [(ngModel)]="description"
          rows="5"
          placeholder="Décrivez les missions et les responsabilités..."
          class="w-full bg-[#111111] border border-gray-600 rounded-lg p-3 text-white focus:border-orange-500 outline-none"
        ></textarea>
      </div>

      <!-- Compétences -->
      <div>
        <label class="block text-white mb-2 font-medium">
          Compétences recherchées *
        </label>
        <textarea
         name="competences"
  [(ngModel)]="competences"
          rows="3"
          placeholder="Exemple : HTML, CSS, JavaScript, Angular..."
          class="w-full bg-[#111111] border border-gray-600 rounded-lg p-3 text-white focus:border-orange-500 outline-none"
        ></textarea>
      </div>

      <!-- Boutons -->
      <div class="flex flex-wrap gap-4 pt-4">

        <button
          type="submit"
          class="bg-orange-500 hover:bg-orange-600 text-white px-8 py-3 rounded-lg font-semibold transition"
        >
          Publier l'offre
        </button>

        <a
          routerLink="/entreprises"
          class="bg-gray-700 hover:bg-gray-600 text-white px-8 py-3 rounded-lg font-semibold transition"
        >
          Annuler
        </a>

      </div>

      <p class="text-gray-500 text-sm">
        * Les champs marqués d'un astérisque sont obligatoires.
      </p>

    </form>

  </div>

</div>
