<div class="min-h-screen bg-[#111111] text-white px-6 py-16">

  <div class="max-w-6xl mx-auto">

    <!-- Titre -->
    <div class="text-center mb-14">
      <h1 class="text-4xl md:text-5xl font-bold mb-5">
        Contactez-<span class="text-orange-500">nous</span>
      </h1>

      <p class="text-gray-400 text-lg">
        Une question ou une suggestion ? Nous sommes à votre écoute.
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-10">

      <!-- Informations de contact -->
      <div class="bg-[#1c1c1c] rounded-xl p-8">

        <h2 class="text-2xl font-bold text-orange-500 mb-8">
          Nos coordonnées
        </h2>

        <div class="mb-7">
          <h3 class="font-semibold mb-2">Adresse</h3>
          <p class="text-gray-400">
            Ouagadougou, Burkina Faso
          </p>
        </div>

        <div class="mb-7">
          <h3 class="font-semibold mb-2">Téléphone</h3>
          <p class="text-gray-400">
            À compléter
          </p>
        </div>

        <div>
          <h3 class="font-semibold mb-2">Adresse e-mail</h3>
          <p class="text-gray-400">
            À compléter
          </p>
        </div>

      </div>

      <!-- Formulaire -->
      <div class="bg-[#1c1c1c] rounded-xl p-8">

        <h2 class="text-2xl font-bold text-orange-500 mb-8">
          Envoyez-nous un message
        </h2>

       <form (ngSubmit)="envoyerMessage()" #contactForm="ngForm" class="space-y-6">

  <div>
    <label class="block mb-2">Nom complet</label>
    <input
      type="text"
      name="nom"
      [(ngModel)]="nom"
      required
      placeholder="Votre nom"
      class="w-full bg-[#111111] border border-gray-600 rounded-md px-4 py-3 text-white outline-none focus:border-orange-500"
    >
  </div>

  <div>
    <label class="block mb-2">Adresse e-mail</label>
    <input
      type="email"
      name="email"
      [(ngModel)]="email"
      required
      email
      placeholder="Votre adresse e-mail"
      class="w-full bg-[#111111] border border-gray-600 rounded-md px-4 py-3 text-white outline-none focus:border-orange-500"
    >
  </div>

  <div>
    <label class="block mb-2">Sujet</label>
    <input
      type="text"
      name="sujet"
      [(ngModel)]="sujet"
      required
      placeholder="Objet de votre message"
      class="w-full bg-[#111111] border border-gray-600 rounded-md px-4 py-3 text-white outline-none focus:border-orange-500"
    >
  </div>

  <div>
    <label class="block mb-2">Message</label>
    <textarea
      name="message"
      [(ngModel)]="message"
      required
      rows="5"
      placeholder="Écrivez votre message..."
      class="w-full bg-[#111111] border border-gray-600 rounded-md px-4 py-3 text-white outline-none focus:border-orange-500"
    ></textarea>
  </div>

  <button
    type="submit"
    class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-md transition"
  >
    Envoyer le message
  </button>

  @if (messageConfirmation) {
    <p class="text-center text-orange-400 mt-4">
      {{ messageConfirmation }}
    </p>
  }

</form>

      </div>

    </div>

  </div>

</div>
